<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Odds</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0f14;
    color: white;
}

header {
    background: #111820;
    padding: 20px;
    border-bottom: 1px solid #26313d;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.subtitle {
    color: #8d9aaa;
    margin-top: 6px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px 15px;
}

.status {
    background: #111820;
    border: 1px solid #26313d;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
}

.status span {
    color: #45d483;
    font-weight: bold;
}

.game {
    background: #111820;
    border: 1px solid #26313d;
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
}

.game-header {
    padding: 15px 18px;
    background: #161e27;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.game-title {
    font-size: 19px;
    font-weight: bold;
}

.book {
    padding: 18px;
    border-top: 1px solid #26313d;
}

.book-name {
    font-weight: bold;
    margin-bottom: 12px;
    color: #55a7ff;
}

.market-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.market {
    background: #0c1218;
    padding: 12px;
    border-radius: 8px;
}

.market-label {
    font-size: 12px;
    color: #7f8b99;
    margin-bottom: 5px;
}

.market-value {
    font-size: 17px;
    font-weight: bold;
}

.probability {
    color: #45d483;
    font-size: 13px;
    margin-top: 4px;
}

.no-data {
    text-align: center;
    padding: 40px;
    color: #8d9aaa;
}

@media(max-width:700px) {
    .market-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>🏈 NFL ODDS</h1>
        <div class="subtitle">
            Live sportsbook comparison & implied probabilities
        </div>
    </div>
</header>

<div class="container">

    <div class="status">
        <div>Data source: <span>Live Odds API</span></div>
        <div id="updated">Loading latest odds...</div>
    </div>

    <div id="games"></div>

</div>

<script>

function americanToProbability(odds) {

    odds = Number(odds);

    if (odds < 0) {
        return (-odds / (-odds + 100)) * 100;
    }

    return (100 / (odds + 100)) * 100;
}

function formatOdds(odds) {

    odds = Number(odds);

    if (odds > 0) {
        return "+" + odds;
    }

    return odds;
}

function getMarket(book, marketKey) {

    if (!book.markets) return null;

    return book.markets.find(m => m.key === marketKey);
}

function findOutcome(market, name) {

    if (!market || !market.outcomes) return null;

    return market.outcomes.find(o => o.name === name);
}

function createMarket(label, outcome) {

    if (!outcome) {

        return `
        <div class="market">
            <div class="market-label">${label}</div>
            <div class="market-value">—</div>
        </div>
        `;

    }

    let odds = Number(outcome.price);

    let probability = americanToProbability(odds);

    let point = "";

    if (outcome.point !== undefined) {
        point = outcome.point > 0
            ? "+" + outcome.point
            : outcome.point;
    }

    return `
    <div class="market">

        <div class="market-label">
            ${label}
        </div>

        <div class="market-value">
            ${point} ${formatOdds(odds)}
        </div>

        <div class="probability">
            ${probability.toFixed(1)}% implied
        </div>

    </div>
    `;
}

function createGame(game) {

    let books = game.bookmakers || [];

    let html = "";

    html += `
    <div class="game">

        <div class="game-header">

            <div class="game-title">
                ${game.away_team} @ ${game.home_team}
            </div>

            <div>
                ${new Date(game.commence_time).toLocaleString()}
            </div>

        </div>
    `;

    books.forEach(book => {

        let moneyline = getMarket(book, "h2h");
        let spreads = getMarket(book, "spreads");
        let totals = getMarket(book, "totals");

        let awayML = moneyline
            ? findOutcome(moneyline, game.away_team)
            : null;

        let homeML = moneyline
            ? findOutcome(moneyline, game.home_team)
            : null;

        let awaySpread = spreads
            ? findOutcome(spreads, game.away_team)
            : null;

        let homeSpread = spreads
            ? findOutcome(spreads, game.home_team)
            : null;

        let over = totals
            ? findOutcome(totals, "Over")
            : null;

        let under = totals
            ? findOutcome(totals, "Under")
            : null;

        html += `
        <div class="book">

            <div class="book-name">
                ${book.title}
            </div>

            <div class="market-grid">

                ${createMarket(
                    game.away_team + " ML",
                    awayML
                )}

                ${createMarket(
                    game.home_team + " ML",
                    homeML
                )}

                ${createMarket(
                    game.away_team + " Spread",
                    awaySpread
                )}

                ${createMarket(
                    game.home_team + " Spread",
                    homeSpread
                )}

                ${createMarket(
                    "Over",
                    over
                )}

                ${createMarket(
                    "Under",
                    under
                )}

            </div>

        </div>
        `;

    });

    html += `</div>`;

    return html;
}

async function loadOdds() {

    const gamesContainer = document.getElementById("games");

    try {

        const response = await fetch("odds.json");

        if (!response.ok) {
            throw new Error("Could not load odds.json");
        }

        const games = await response.json();

        document.getElementById("updated").innerHTML =
            "Latest odds loaded: <span>LIVE DATA</span>";

        if (!games || games.length === 0) {

            gamesContainer.innerHTML = `
                <div class="no-data">
                    No NFL odds are currently available.
                </div>
            `;

            return;
        }

        gamesContainer.innerHTML =
            games.map(createGame).join("");

    }

    catch (error) {

        console.error(error);

        gamesContainer.innerHTML = `
            <div class="no-data">
                Unable to load live NFL odds.
                <br><br>
                Make sure odds.json exists in the repository.
            </div>
        `;

        document.getElementById("updated").innerHTML =
            "Unable to load latest odds";

    }

}

loadOdds();

</script>

</body>
</html>
