<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridiron Edge // AI Model Transfer</title>
    <style>
        :root {
            --bg-dark: #0a0d14;
            --card-bg: #111622;
            --input-bg: #07090e;
            --accent-green: #00ff73;
            --border-color: #1c2436;
            --text-main: #ffffff;
            --text-muted: #5e6d8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 900px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .title span {
            color: var(--accent-green);
        }

        .badge {
            background-color: rgba(0, 255, 115, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-green);
        }

        .btn {
            background-color: var(--accent-green);
            color: #000;
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .terminal {
            background-color: #05070a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            height: 280px;
            overflow-y: auto;
            color: #8da2c4;
        }

        .log-line {
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .log-system {
            color: #5e6d8a;
        }

        .log-success {
            color: var(--accent-green);
        }
    </style>
</head>
<body>

<div class="panel">
    <div class="header">
        <div class="title">GRIDIRON EDGE <span>// AI MODEL TRANSFER</span></div>
        <div class="badge" id="status-badge">SYSTEM READY</div>
    </div>

    <div class="content-grid">
        <div class="left-panel">
            <div class="form-group">
                <label>Select Target AI Model</label>
                <select id="model-select">
                    <option>Live Game Simulation Engine (v4.2-Beta)</option>
                    <option>Player Prop Deep Predictor (v1.0)</option>
                    <option>Vegas Line Discrepancy Finder (v2.1)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Destination Environment</label>
                <input type="text" value="https://cluster.internal">
            </div>

            <div class="form-group">
                <label>Secure Access Key / Hash</label>
                <input type="password" value="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
            </div>

            <button class="btn" id="deploy-btn">Deploy & Transfer Core</button>
        </div>

        <div class="right-panel">
            <div class="terminal" id="terminal-output">
                <div class="log-line"><span class="log-system">[SYSTEM]</span> Matrix interface compiled successfully.</div>
                <div class="log-line"><span class="log-system">[SYSTEM]</span> Verification keys set. Awaiting manual activation flag...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const btn = document.getElementById('deploy-btn');
    const terminal = document.getElementById('terminal-output');
    const badge = document.getElementById('status-badge');

    btn.addEventListener('click', () => {
        // Prevent double clicking
        btn.disabled = true;
        btn.innerText = "Transferring...";
        badge.innerText = "TRANSFER ACTIVE";
        badge.style.borderColor = "#ffaa00";
        badge.style.color = "#ffaa00";
        badge.style.backgroundColor = "rgba(255, 170, 0, 0.1)";

        const logs = [
            "Handshake initiated with https://cluster.internal...",
            "Validating Secure Access Key...",
            "Authorization GRANTED.",
            "Freezing live neural weights layer...",
            "Streaming 4.2-Beta core tensors (14.2 GB)...",
            "Data pipeline running at 850 MB/s...",
            "Validating SHA-256 validation signatures...",
            "SUCCESS: Core transferred to target environment successfully."
        ];

        let index = 0;
        function printLog() {
            if (index < logs.length) {
                const line = document.createElement('div');
                line.className = 'log-line';
                
                if (index === 2 || index === 7) {
                    line.innerHTML = `<span class="log-success">[SUCCESS]</span> ${logs[index]}`;
                } else {
                    line.innerHTML = `<span class="log-system">[PROCESS]</span> ${logs[index]}`;
                }
                
                terminal.appendChild(line);
                terminal.scrollTop = terminal.scrollHeight;
                index++;
                setTimeout(printLog, 1000);
            } else {
                btn.disabled = false;
                btn.innerText = "Deploy & Transfer Core";
                badge.innerText = "ONLINE / DEPLOYED";
                badge.style.borderColor = "#00ff73";
                badge.style.color = "#00ff73";
                badge.style.backgroundColor = "rgba(0, 255, 115, 0.1)";
            }
        }

        setTimeout(printLog, 500);
    });
</script>

</body>
</html>
